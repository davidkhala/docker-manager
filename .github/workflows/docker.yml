name: docker test

on:
  push:
  workflow_dispatch:
jobs:
  nodejs:
    defaults:
      run:
        working-directory: nodejs
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{matrix.os}}
    timeout-minutes: 15
    steps:
      - uses: davidkhala/setup-dockerode@main
      - run: npm i
      - run: npm test
        timeout-minutes: 4
  nodejs-rootful:
    defaults:
      run:
        working-directory: nodejs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@main
        with:
          check-latest: true
          node-version: lts/*
      - uses: actions/checkout@main
      - run: npm i
      - run: npm test
        timeout-minutes: 4
