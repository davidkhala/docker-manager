name: docker test

on:
  push:
  workflow_dispatch:
jobs:

  nodejs:
    defaults:
      run:
        working-directory: nodejs
    strategy:
      matrix: 
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{matrix.os}}
    steps:
    - uses: davidkhala/setup-dockerode@main
    - name: ensure Docker engine is running (Windows)
      if: runner.os == 'Windows'
      run: |
        Get-Service docker | Format-List Name, Status, StartType
        if ((Get-Service docker).Status -ne 'Running') { Start-Service docker }
        docker version
    - run: npm i
    - run: npm test
  

  