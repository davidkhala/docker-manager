name: docker test

on:
  push:
  workflow_dispatch:
jobs:
  nodejs:
    defaults:
      run:
        working-directory: nodejs
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{matrix.os}}
    steps:
      - uses: davidkhala/setup-dockerode@main
      - run: npm i
      - run: npm test
      - run: npx mocha test-rootless
        if: runner.os == 'Linux'
  nodejs-hosts:
    defaults:
      run:
        working-directory: nodejs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@main
        with:
          check-latest: true
          node-version: lts/*
      - uses: actions/checkout@main
      - run: npm i
      - run: npx mocha test/tls.js
        timeout-minutes: 4
